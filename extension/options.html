<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 4px; }
    input { width: 100%; padding: 8px; font-size: 13px; font-family: monospace; box-sizing: border-box; }
    button { margin-top: 18px; padding: 9px 22px; font-size: 14px; border: none; border-radius: 8px; background: #D92B57; color: #fff; cursor: pointer; }
    #status { margin-left: 12px; font-size: 13px; color: #0E7D6B; }
    p.hint { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <h1>Duoyin Ingest — Cài đặt</h1>
  <p class="hint">ID lấy từ URL Drive/Sheet. Mặc định đã trỏ vào nơi lưu tạo ngày 16.08.2026 (contract/sheet-columns.md).</p>
  <label for="inboxFolderId">Drive inbox folder ID</label>
  <input id="inboxFolderId">
  <label for="spreadsheetId">Spreadsheet ID (queue)</label>
  <input id="spreadsheetId">
  <button id="save">Lưu</button>
  <button id="format" style="background:#1F2937">Trang trí Sheet (dropdown + màu, chạy 1 lần)</button>
  <span id="status"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
